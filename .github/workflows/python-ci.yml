# ---------------------------------------------------------------------------
# Continuous Integration workflow.
#
# Goal: on every push/PR to main, prove the code is in a shippable state
# *before* anything downstream (like the Docker build/push workflow) touches
# it. This workflow deliberately does nothing with secrets or deployments -
# its only job is "lint it, test it, report pass/fail".
#
# docker-build.yml watches for this workflow to finish via a `workflow_run`
# trigger, matched by the `name:` below - so if you rename this workflow,
# update docker-build.yml's trigger to match.
# ---------------------------------------------------------------------------
name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # Lint job: static analysis only, no app execution. Runs independently
  # of the test job so a style issue and a test failure are both reported
  # even if only one of them is wrong.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # Cache pip downloads between runs, keyed off requirements-dev.txt,
          # so repeat runs don't re-download the same wheels every time.
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies (includes ruff)
        run: python -m pip install -r requirements-dev.txt

      - name: Run ruff lint checks
        run: ruff check .

  # ---------------------------------------------------------------------
  # Test job: runs the actual pytest suite against the Flask app, with a
  # coverage report so you can see how much of app/ the tests exercise.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies (includes pytest)
        run: python -m pip install -r requirements-dev.txt

      - name: Run test suite with coverage
        run: python -m pytest -v --cov=app --cov-report=term-missing
