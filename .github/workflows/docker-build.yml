name: Docker build

on:
    workflow_run:
        workflows: ["Python CI"]
        types: [completed]
        branches: [main]

permissions:
    contents: read
    actions: read

jobs:
    build:
        if: >-
            github.event.workflow_run.conclusion == 'success' && 
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout tested commit
              uses: actions/checkout@v4
              with:
                ref: ${{ github.event.workflow_run.head_sha }}

            - name: Build docker image
              run: |
                docker build \
                  -t python-ci-lab:${{ github.event.workflow_run.head_sha }} \
                  -t python-ci-lab:latest .
            